<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon V2</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(91, 195, 255, 0.12), transparent 30%),
          radial-gradient(circle at 80% 85%, rgba(180, 80, 255, 0.10), transparent 32%),
          linear-gradient(180deg, #07111c, #0b1730 58%, #08111f);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      /* ── Shell ──────────────────────────────────────────────────────────── */
      .shell {
        position: relative;
        width: min(100vw, 1120px);
        padding: 18px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border: 2px solid rgba(140, 243, 255, 0.22);
        border-radius: 18px;
        box-shadow:
          0 24px 84px rgba(0, 0, 0, 0.52),
          0 0 42px rgba(91, 195, 255, 0.10);
        background: #0a0e1a;
      }

      /* ── Fullscreen button ───────────────────────────────────────────────── */
      #fs-btn {
        position: absolute;
        bottom: 26px;
        right: 26px;
        width: 34px;
        height: 34px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 11, 22, 0.75);
        border: 1.5px solid rgba(140, 243, 255, 0.28);
        border-radius: 8px;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.15s, border-color 0.15s, background 0.15s;
        outline: none;
      }
      #fs-btn:hover, #fs-btn:focus-visible {
        opacity: 1;
        border-color: rgba(140, 243, 255, 0.75);
        background: rgba(20, 30, 55, 0.88);
      }
      #fs-btn svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: #8cf3ff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      #fs-btn .icon-compress { display: none; }

      /* ── Fullscreen overrides ────────────────────────────────────────────── */
      .shell:fullscreen {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07111c;
      }
      .shell:fullscreen canvas {
        /* fill width but cap at 16:9 so it never letterboxes on wide screens */
        width: min(100vw, calc(100vh * 16 / 9));
        height: auto;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
      .shell:fullscreen #fs-btn {
        /* keep button visible in fullscreen — stick to viewport corner */
        position: fixed;
        bottom: 16px;
        right: 16px;
        opacity: 0.35;
      }
      .shell:fullscreen #fs-btn:hover {
        opacity: 1;
      }
      .shell:fullscreen .icon-expand   { display: none; }
      .shell:fullscreen .icon-compress { display: block; }

      /* Firefox prefix */
      .shell:-moz-full-screen          { width:100vw; max-width:100vw; height:100vh; padding:0; display:flex; align-items:center; justify-content:center; background:#07111c; }
      .shell:-moz-full-screen canvas   { width:min(100vw, calc(100vh * 16 / 9)); height:auto; border-radius:0; border:none; box-shadow:none; }
      .shell:-moz-full-screen #fs-btn  { position:fixed; bottom:16px; right:16px; opacity:0.35; }
      .shell:-moz-full-screen .icon-expand   { display:none; }
      .shell:-moz-full-screen .icon-compress { display:block; }

      /* WebKit prefix */
      .shell:-webkit-full-screen         { width:100vw; max-width:100vw; height:100vh; padding:0; display:flex; align-items:center; justify-content:center; background:#07111c; }
      .shell:-webkit-full-screen canvas  { width:min(100vw, calc(100vh * 16 / 9)); height:auto; border-radius:0; border:none; box-shadow:none; }
      .shell:-webkit-full-screen #fs-btn { position:fixed; bottom:16px; right:16px; opacity:0.35; }
      .shell:-webkit-full-screen .icon-expand   { display:none; }
      .shell:-webkit-full-screen .icon-compress { display:block; }
    </style>
  </head>
  <body>
    <div class="shell">
      <canvas id="canvas"></canvas>

      <!-- Fullscreen toggle button -->
      <button id="fs-btn" title="Toggle fullscreen (F)" aria-label="Toggle fullscreen">
        <!-- Expand icon (enter fullscreen) -->
        <svg class="icon-expand" viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
        </svg>
        <!-- Compress icon (exit fullscreen) -->
        <svg class="icon-compress" viewBox="0 0 24 24">
          <path d="M8 3v5H3"/>
          <path d="M16 3v5h5"/>
          <path d="M21 16h-5v5"/>
          <path d="M3 16h5v5"/>
        </svg>
      </button>
    </div>

    <script type="module" src="src/main.js?v=0.14.0"></script>

    <script>
      const shell = document.querySelector('.shell');
      const btn   = document.getElementById('fs-btn');

      function toggleFS() {
        if (!document.fullscreenElement) {
          (shell.requestFullscreen?.() ?? shell.webkitRequestFullscreen?.() ?? shell.mozRequestFullScreen?.());
        } else {
          (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.() ?? document.mozCancelFullScreen?.());
        }
      }

      btn.addEventListener('click', toggleFS);

      // F key shortcut (when not typing in a text field)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' || e.key === 'F') {
          if (document.activeElement?.tagName === 'INPUT') return;
          toggleFS();
        }
      });
    </script>
  </body>
</html>
